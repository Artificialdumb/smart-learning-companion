[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-learning-companion"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1"]

[project.optional-dependencies]
test = ["httpx>=0.27,<1"]
docs = ["pymupdf>=1.24,<3"]

[tool.setuptools.packages.find]
include = ["app*", "tools*"]

[tool.setuptools.package-data]
"app" = ["rules.json"]
"app.catalog" = ["curriculum.json"]
"app.web" = ["static/*"]

[tool.setuptools.data-files]
"share/smart-learning-companion" = ["docs/interfaces/contracts.md", "docs/interfaces/integration.md", "docs/evaluation/掌握度证据权重说明.md"]
