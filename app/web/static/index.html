<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>智慧学伴 · 七年级数学</title>
  <link rel="stylesheet" href="/static/style.css">
  <script type="module" src="/static/main.js"></script>
</head>
<body>
  <a class="skip-link" href="#workspace">跳到主要内容</a>
  <header class="site-header">
    <div class="shell header-inner">
      <div class="identity">
        <span class="brand-mark" aria-hidden="true">学</span>
        <div><strong>智慧学伴</strong><small>七年级数学</small></div>
      </div>
      <nav aria-label="工作区">
        <a href="#student" data-view="student">个人诊断</a>
        <a href="#classes" data-view="classes">班级对比</a>
        <a href="#catalog" data-view="catalog">课程材料</a>
      </nav>
    </div>
  </header>
  <main id="workspace" class="shell" tabindex="-1">
    <div class="page-head">
      <div><h1 id="page-title">个人诊断</h1><p id="page-note">查看作答证据与下一步学习活动。</p></div>
      <div class="filters">
        <label id="student-filter" hidden>学生<select id="student"></select></label>
        <label id="node-filter" hidden>测验<select id="node"></select></label>
      </div>
    </div>
    <p id="status" role="status" aria-live="polite"></p>
    <div id="content"></div>
  </main>
  <dialog id="detail" aria-labelledby="detail-title">
    <div class="dialog-head">
      <h2 id="detail-title">详情</h2>
      <form method="dialog"><button class="secondary" autofocus>关闭</button></form>
    </div>
    <div id="detail-body"></div>
  </dialog>
</body>
</html>
